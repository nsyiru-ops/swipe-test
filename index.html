<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Swipe Video Scrub (Mobile Fix)</title>
  <style>
    html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
    .stage{
      position:fixed; inset:0;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      box-sizing:border-box;
      display:flex; align-items:center; justify-content:center;
      height:100svh; height:100dvh; width:100vw;
      touch-action:none; overscroll-behavior:none;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
      background:#000;
    }
    .stage.prestart{
      background:#000 center / contain no-repeat;
      background-image: var(--poster-bg);
    }
    video{
      width:100%; height:100%;
      object-fit:contain;
      background:#000;
      display:block;
      pointer-events:none;
    }
    .poster{
      position:absolute; inset:0; z-index:5;
      display:flex; align-items:center; justify-content:center;
      background:#000 center / contain no-repeat;
      background-image: var(--poster-bg);
      pointer-events:none;
      opacity:1;
      transition: opacity 180ms ease;
    }
    .poster img{ width:100%; height:100%; object-fit:contain; display:block; }
    .poster.hidden{ opacity:0; }

    .sound-btn{
      position:absolute;
      top: calc(env(safe-area-inset-top) + 10px);
      left: calc(env(safe-area-inset-left) + 10px);
      z-index:10;
      pointer-events:auto;
      border:0;
      border-radius:999px;
      padding:10px 12px;
      background: rgba(0,0,0,.55);
      color:#fff;
      font:600 14px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing:.2px;
      display:inline-flex; align-items:center; gap:8px;
      -webkit-tap-highlight-color: transparent;
    }
    .sound-btn:active{ transform: scale(.98); }
    .sound-dot{ width:8px; height:8px; border-radius:999px; background:#00ff84; opacity:.95; }
    .sound-dot.off{ background:#ff4d4d; }
  </style>
</head>
<body>
  <div class="stage prestart" id="stage">
    <button class="sound-btn" id="soundBtn" type="button" aria-label="Sound toggle">
      <span class="sound-dot" id="soundDot"></span>
      <span id="soundLabel">SOUND ON</span>
    </button>

    <div class="poster" id="poster">
      <img id="posterImg" alt="Poster" loading="eager" />
    </div>

    <video id="v" playsinline webkit-playsinline muted loop preload="auto"></video>
    <audio id="bgm" loop preload="auto"></audio>
  </div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const video = document.getElementById('v');
  const audio = document.getElementById('bgm');
  const poster = document.getElementById('poster');
  const posterImg = document.getElementById('posterImg');
  const soundBtn = document.getElementById('soundBtn');
  const soundDot = document.getElementById('soundDot');
  const soundLabel = document.getElementById('soundLabel');

  const POSTER_CANDIDATES = ['poster.png', 'source/poster.png'];
  const VIDEO_CANDIDATES  = ['source/video.mp4', 'video.mp4'];
  const AUDIO_CANDIDATES  = ['source/bgm.mp3',  'bgm.mp3'];

  // 모바일 스크럽 튜닝
  const SCREEN_WIDTHS_PER_FULL_LOOP = 0.85;
  const SCRUB_THRESHOLD_PX = 6;
  const SCRUB_GRACE_MS = 40;

  let started = false;
  let ready = false;
  let duration = 0;

  let down = false;
  let scrubbing = false;
  let startX = 0;
  let lastX = 0;
  let downAt = 0;
  let downPointerType = 'mouse';

  let virtualTime = 0;
  let targetTime = null;
  let seekRaf = 0;

  function setPosterCSS(url){
    stage.style.setProperty('--poster-bg', `url("${url}")`);
    poster.style.setProperty('--poster-bg', `url("${url}")`);
  }

  function tryLoadFirstWorking(candidates, onOk){
    let i=0;
    const next = () => {
      const url = candidates[i++];
      if(!url) return;
      onOk(url, next);
    };
    next();
  }

  function modTime(t){
    if(!duration || !isFinite(duration)) return 0;
    const eps = 0.0005;
    let x = t % duration;
    if(x < 0) x += duration;
    if(x >= duration) x = duration - eps;
    return x;
  }

  function secondsPerPixel(){
    const w = Math.max(1, window.innerWidth);
    return duration / (w * SCREEN_WIDTHS_PER_FULL_LOOP);
  }

  function applySeek(){
    seekRaf = 0;
    if(targetTime == null) return;

    if (video.seeking) {
      seekRaf = requestAnimationFrame(applySeek);
      return;
    }

    const t = targetTime;
    targetTime = null;

    try{
      if (typeof video.fastSeek === 'function') video.fastSeek(t);
      else video.currentTime = t;
    }catch(_){}
  }

  function requestSeek(t){
    targetTime = modTime(t);
    if(seekRaf) return;
    seekRaf = requestAnimationFrame(applySeek);
  }

  function hidePosterSoon(){
    if(!poster || poster.dataset.hidden === '1') return;
    poster.dataset.hidden = '1';
    poster.classList.add('hidden');
    setTimeout(() => {
      if(poster && poster.parentNode) poster.parentNode.removeChild(poster);
      stage.classList.remove('prestart');
    }, 220);
  }

  function hidePosterAfterFirstVideoFrame(){
    try{
      if(typeof video.requestVideoFrameCallback === 'function'){
        video.requestVideoFrameCallback(() => hidePosterSoon());
        return;
      }
    }catch(_){}
    setTimeout(hidePosterSoon, 220);
  }

  function tryEnterFullscreen(){
    const el = stage;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(!req) return;
    try { req.call(el); } catch(_) {}
  }

  function updateSoundUI(){
    const m = !!audio.muted;
    soundDot.classList.toggle('off', m);
    soundLabel.textContent = m ? 'SOUND OFF' : 'SOUND ON';
  }

  // 파일 경로 폴백
  tryLoadFirstWorking(POSTER_CANDIDATES, (url, fail) => {
    setPosterCSS(url);
    posterImg.src = url;
    posterImg.onerror = () => fail();
  });

  tryLoadFirstWorking(VIDEO_CANDIDATES, (url, fail) => {
    video.src = url;
    video.onerror = () => fail();
  });

  tryLoadFirstWorking(AUDIO_CANDIDATES, (url, fail) => {
    audio.src = url;
    audio.onerror = () => fail();
  });

  try { video.load(); audio.load(); } catch(_) {}

  audio.muted = false;
  updateSoundUI();

  video.addEventListener('loadedmetadata', () => {
    duration = video.duration || 0;
    ready = !!duration && isFinite(duration);
  });

  async function tryPlayVideoOnce(){
    try{
      await video.play();
      hidePosterAfterFirstVideoFrame();
      return true;
    }catch(_){
      return false;
    }
  }

  function startExperience(){
    if(started) return;
    started = true;

    video.muted = true;
    tryPlayVideoOnce();

    audio.play().catch(()=>{});
    updateSoundUI();

    tryEnterFullscreen();

    setTimeout(() => {
      if(video.paused) tryPlayVideoOnce();
    }, 0);
  }

  function isSoundButtonEventTarget(e){
    const t = e.target;
    return t && (t === soundBtn || (t.closest && t.closest('#soundBtn')));
  }

  // 사운드 버튼
  soundBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    startExperience();

    audio.muted = !audio.muted;
    updateSoundUI();
    if(!audio.muted) audio.play().catch(()=>{});
  });
  soundBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  soundBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive:true });

  function beginScrubIfNeeded(clientX){
    if(scrubbing || !ready) return;

    const elapsed = performance.now() - downAt;
    if(elapsed < SCRUB_GRACE_MS) return;

    const moved = Math.abs(clientX - startX);
    if(moved < SCRUB_THRESHOLD_PX) return;

    scrubbing = true;
    virtualTime = video.currentTime || 0;
    try { video.pause(); } catch(_) {}
  }

  function onDown(clientX, pointerType){
    startExperience();

    down = true;
    scrubbing = false;
    startX = lastX = clientX;
    downAt = performance.now();
    downPointerType = pointerType || 'mouse';
  }

  function onMove(clientX, buttons){
    if(!down) return;

    // 데스크톱 마우스는 클릭 드래그에서만 스크럽
    if(downPointerType === 'mouse' && !(buttons & 1)) return;

    beginScrubIfNeeded(clientX);
    if(!scrubbing || !ready){
      lastX = clientX;
      return;
    }

    const dx = clientX - lastX;
    const dt = (-dx) * secondsPerPixel();
    virtualTime += dt;
    requestSeek(virtualTime);
    lastX = clientX;
  }

  function onUp(){
    if(!down) return;
    down = false;

    if(scrubbing){
      setTimeout(() => { video.play().catch(()=>{}); }, 0);
    } else {
      if(started && video.paused) tryPlayVideoOnce();
    }
    scrubbing = false;
  }

  // 입력 모델 통합
  const usePointer = !!window.PointerEvent;

  if (usePointer) {
    stage.addEventListener('pointerdown', (e) => {
      if(isSoundButtonEventTarget(e)) return;
      if(e.button != null && e.button !== 0) return;
      stage.setPointerCapture?.(e.pointerId);
      onDown(e.clientX, e.pointerType || 'mouse');
    }, { passive:false });

    stage.addEventListener('pointermove', (e) => {
      onMove(e.clientX, e.buttons || 0);
    }, { passive:false });

    stage.addEventListener('pointerup', () => onUp(), { passive:false });
    stage.addEventListener('pointercancel', () => onUp(), { passive:false });

  } else {
    function getTouchX(e){
      const t = e.touches && e.touches[0];
      return t ? t.clientX : 0;
    }

    stage.addEventListener('touchstart', (e) => {
      if(isSoundButtonEventTarget(e)) return;
      if(e.cancelable) e.preventDefault();
      onDown(getTouchX(e), 'touch');
    }, { passive:false });

    stage.addEventListener('touchmove', (e) => {
      if(isSoundButtonEventTarget(e)) return;
      if(e.cancelable) e.preventDefault();
      onMove(getTouchX(e), 1);
    }, { passive:false });

    stage.addEventListener('touchend', (e) => {
      if(isSoundButtonEventTarget(e)) return;
      if(e.cancelable) e.preventDefault();
      onUp();
    }, { passive:false });

    stage.addEventListener('touchcancel', (e) => {
      if(isSoundButtonEventTarget(e)) return;
      if(e.cancelable) e.preventDefault();
      onUp();
    }, { passive:false });
  }

  // click backup
  stage.addEventListener('click', (e) => {
    if(isSoundButtonEventTarget(e)) return;
    startExperience();
    if(video.paused) tryPlayVideoOnce();
  }, { capture:true });

  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && started){
      if(video.paused) tryPlayVideoOnce();
      if(!audio.muted) audio.play().catch(()=>{});
    }
  });

})();
</script>
</body>
</html>
